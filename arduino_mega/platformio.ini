[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter

lib_deps =
    waspinator/AccelStepper@^1.64.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
    adafruit/Adafruit BusIO@^1.17.0
    https://github.com/Testato/SoftwareWire.git

lib_ldf_mode = deep+